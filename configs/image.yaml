seed: 27
data_config: configs/data.yaml

# One YOLOv8 run per domain so aerial-thermal and camera-trap numbers are never pooled.
train_per_domain: true
base_weights: yolov8n.pt
imgsz: 640
epochs: 50
batch: 8
device: cpu
workers: 2
patience: 15
project_dir: models/image/runs

# Oversample rare box classes up to the most common box class.
# Empty (negative) images are never removed and never used as the oversample target.
oversample_rare: true
max_copies_per_image: 20

augmentation:
  hsv_v: 0.4
  hsv_h: 0.015
  hsv_s: 0.4
  degrees: 5.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 1.0
  erasing: 0.2
  close_mosaic: 10

# COCO small-object cutoff (pixels^2) for recall bucketing.
small_area_px: 1024
iou_match: 0.5

smoke:
  # Tiny synthetic set; a few more epochs overfits the colored boxes for demos.
  epochs: 25
  imgsz: 320
  batch: 4
  workers: 0
