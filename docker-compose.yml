services:
  guardianeye:
    build: .
    ports:
      - "8742:8742"
    environment:
      GUARDIANEYE_HOST: 0.0.0.0
      GUARDIANEYE_PORT: 8742
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8742/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
